# Local development stack — mirrors the live NAS topology
# (compose project at /home/mihu/Server, root-owned; see docs/prod-stack.md)

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-personal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-personal}
      POSTGRES_DB: ${POSTGRES_DB:-personal}
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7

  app:
    build: ./src
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-personal}:${POSTGRES_PASSWORD:-personal}@db:5432/${POSTGRES_DB:-personal}
      REDIS_URL: redis://redis:6379/0
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      PUBLIC_BASE: ${PUBLIC_BASE:-http://localhost:8000}
    ports:
      - "8000:8000"
    volumes:
      - ./src/uploads:/app/uploads
      - ./src/scripts:/app/scripts
    depends_on:
      - db
      - redis

  worker:
    build: ./src
    command: python worker.py
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis

volumes:
  pgdata:
